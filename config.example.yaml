# CloudOS 7.0 云主机检查工具配置
endpoint: "https://127.0.0.1:30990"   # API 服务地址（私有云一般为 https://k8sVIP:30990）
insecureSkipVerify: true               # 跳过证书校验（自签名证书时设为 true）

# 平台凭证：控制台 -> 统一身份认证 -> 访问秘钥
accessKeyId: "your-access-key-id"
accessKeySecret: "your-access-key-secret"

regionId: "cn-beijing"

# 检查的资源类型: ecs(默认,弹性云主机) / bms(裸金属) / all(两者都查)
resource:
  type: "ecs"

# 虚拟机所属项目（按名称匹配，同名多项目时程序会列出让您选择）
# names 支持多个项目；填 "*" 或 "all" 表示检查全部项目
# 兼容旧的单项目配置 project.name
project:
  names:
    - "国家药监云一体化管理平台"
    - "CA-密码"
    # - "*"    # 检查全部项目

http:
  timeout: 30s
  concurrent: 10      # 取密码/详情等 API 并发请求数，默认 10（调大可加快，注意平台压力）

pagination:
  pageSize: 100        # DescribeEcs/DescribeDisks/DescribeEnis 分页大小，部分平台有上限，报错时可调小

ssh:
  username: root       # 登录用户名
  port: 22             # SSH 端口
  timeout: 10s         # 单台登录测试超时
  workers: 5           # 并发测试数量
  verifyCommand: "echo ok"   # 登录成功后执行的验证命令
  useIp: internal      # 用哪个IP测试: internal=内网IP / eip=弹性公网IP / internal-then-eip=先内网后EIP
  checkStatus: true    # 登录成功后采集服务器运行状态(OS/内核/负载/CPU/内存/磁盘)，true/false，未配置默认true
  checkServices: true  # 登录成功后检查服务运行状态，true/false，未配置默认true
  services:            # 要检查的服务名列表；留空默认检查 sshd，如 sshd/crond/docker/nginx
    - sshd
    # - crond
    # - docker

  # 脚本执行（可选）：SSH 登录成功后，在每台服务器上以 root 执行脚本。
  # script 与 scriptPath 二选一：
  #   - script:     直接在配置里内嵌脚本内容（多行，注意缩进）
  #   - scriptPath: 本地脚本文件路径，工具读取内容后通过 bash -s 在远端执行，无需上传
  # 脚本内容走 SSH stdin 传输，不需要写文件、无转义问题；脚本请用 LF 换行。
  # 脚本以 root 身份执行，等同于远端任意代码执行，请勿在脚本中写入密码等敏感信息。
  # 结果分类（屏幕「脚本执行」列 + Excel「脚本执行结果」Sheet）：
  #   成功 / 失败(exit N) / 超时 / 会话中断(疑似关机/重启，如脚本里执行了 init 0、reboot)。
  # 失败/超时/会话中断时，stderr 会自动回显该台机器的状态、原因与输出尾部(最后20行)，便于当场定位。
  # 单台输出上限 100KB，超出截断（保留末尾）并标注，防止脚本刷屏拖垮内存/Excel 导出。
  # 注意: 脚本失败/超时/会话中断均不影响 SSH 登录结果标记。
  script: ""
  # scriptPath: "scripts/check.sh"
  scriptTimeout: 60s   # 单台脚本执行超时，默认 60s，超时强制中断并标记失败

  # 文件上传（可选）：SSH 登录成功后、执行脚本前，把本地文件传到远端指定位置。
  # 每条规则一个本地文件 -> 远端绝对路径；同名文件已存在时默认跳过（安全），
  # 设置 overwrite: true 或全局 uploadOverwrite: true 才会覆盖替换。
  # 典型用法：先上传脚本到目标目录（可替换旧版），再用 remoteWorkDir + script 在该目录运行。
  uploadOverwrite: false   # 全局默认是否覆盖同名文件；false=远端已存在则跳过，true=总是覆盖
  uploadMkdirs: true       # 远端父目录不存在时自动创建，未配置默认 true
  remoteWorkDir: ""        # 执行脚本前先 cd 到的远端目录（绝对路径），如 "/opt/myapp"
  upload:
    - local: "scripts/deploy.sh"      # 本地文件路径
      remote: "/opt/myapp/deploy.sh" # 远端绝对路径（“传到指定位置”），父目录不存在会自动创建
      mode: "0755"                    # 远端文件权限（八进制字符串），默认 0644；脚本类建议 0755
      overwrite: true                  # 可选：覆盖同名文件；缺省用上面的 uploadOverwrite
    # - local: "config/app.conf"
    #   remote: "/etc/app/app.conf"   # 这个文件默认不覆盖，远端已有就跳过
  # 注意：上传失败时该台机器的脚本不会执行（标记“未执行”，避免误跑远端旧文件），
  #       但上传失败/跳过均不影响 SSH 登录结果标记；跳过与失败会在 stderr 回显。

# 接口原始返回数据保存目录，留空则不保存
# 目录结构: raw.dir/<运行时间戳>/<Action>[_p<页码>].json
# 注意: 原始数据可能包含 root 密码等敏感信息，注意保管
raw:
  dir: ""

output:
  showPassword: true   # 屏幕是否显示密码，false 则显示 ******
  csvPath: ""          # 留空不导出CSV，如 "result.csv"
  excelPath: ""        # 留空不导出Excel，如 "result.xlsx"
  # 脚本输出落盘目录（可选），留空不落盘；配置后每台执行过脚本的机器一个 .log:
  # 目录结构: scriptDir/<运行时间戳>/<机器名>_<内网IP>.log，方便逐行排查完整输出
  scriptDir: ""
