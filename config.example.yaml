# CloudOS 7.0 云主机检查工具配置
endpoint: "https://127.0.0.1:30990"   # API 服务地址（私有云一般为 https://k8sVIP:30990）
insecureSkipVerify: true               # 跳过证书校验（自签名证书时设为 true）

# 平台凭证：控制台 -> 统一身份认证 -> 访问秘钥
accessKeyId: "your-access-key-id"
accessKeySecret: "your-access-key-secret"

regionId: "cn-beijing"

# 检查的资源类型: ecs(默认,弹性云主机) / bms(裸金属) / all(两者都查)
resource:
  type: "ecs"

# 虚拟机所属项目（按名称匹配，同名多项目时程序会列出让您选择）
# names 支持多个项目；填 "*" 或 "all" 表示检查全部项目
# 兼容旧的单项目配置 project.name
project:
  names:
    - "国家药监云一体化管理平台"
    - "CA-密码"
    # - "*"    # 检查全部项目

http:
  timeout: 30s

pagination:
  pageSize: 100        # DescribeEcs/DescribeDisks/DescribeEnis 分页大小，部分平台有上限，报错时可调小

ssh:
  username: root       # 登录用户名
  port: 22             # SSH 端口
  timeout: 10s         # 单台登录测试超时
  workers: 5           # 并发测试数量
  verifyCommand: "echo ok"   # 登录成功后执行的验证命令
  useIp: internal      # 用哪个IP测试: internal=内网IP / eip=弹性公网IP / internal-then-eip=先内网后EIP
  checkStatus: true    # 登录成功后采集服务器运行状态(OS/内核/负载/CPU/内存/磁盘)，true/false，未配置默认true
  checkServices: true  # 登录成功后检查服务运行状态，true/false，未配置默认true
  services:            # 要检查的服务名列表；留空默认检查 sshd，如 sshd/crond/docker/nginx
    - sshd
    # - crond
    # - docker

# 接口原始返回数据保存目录，留空则不保存
# 目录结构: raw.dir/<运行时间戳>/<Action>[_p<页码>].json
# 注意: 原始数据可能包含 root 密码等敏感信息，注意保管
raw:
  dir: ""

output:
  showPassword: true   # 屏幕是否显示密码，false 则显示 ******
  csvPath: ""          # 留空不导出CSV，如 "result.csv"
  excelPath: ""        # 留空不导出Excel，如 "result.xlsx"
