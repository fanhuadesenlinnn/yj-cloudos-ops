# CloudOS 7.0 云主机检查工具配置
endpoint: "https://127.0.0.1:30990"   # API 服务地址（私有云一般为 https://k8sVIP:30990）
insecureSkipVerify: true               # 跳过证书校验（自签名证书时设为 true）

# 平台凭证：控制台 -> 统一身份认证 -> 访问秘钥
accessKeyId: "your-access-key-id"
accessKeySecret: "your-access-key-secret"

regionId: "cn-beijing"

# 检查的资源类型: ecs(默认,弹性云主机) / bms(裸金属) / all(两者都查)
resource:
  type: "ecs"

# 虚拟机所属项目（按名称匹配，同名多项目时程序会列出让您选择）
# names 支持多个项目；填 "*" 或 "all" 表示检查全部项目
# 兼容旧的单项目配置 project.name
project:
  names:
    - "国家药监云一体化管理平台"
    - "CA-密码"
    # - "*"    # 检查全部项目

# IP 筛选（可选）：选定项目后，再按 IP 圈定/剔除需要执行的主机。
# 被过滤掉的主机：不执行 SSH 测试、不取密码、不出现在结果表中，仅统计显示（共拉取 X 台，过滤掉 Y 台，保留 Z 台执行）。
# includeIPs 圈定白名单（不配置则不限制）；excludeIPs 剔除黑名单；先 include 圈定，再剔除 exclude。
# IP 列表匹配内网 IP，EIP 列表匹配弹性公网 IP；每条规则支持：
#   精确 IP: "10.10.1.5"
#   CIDR:   "10.10.1.0/24"
#   通配符: "10.10.0.*"（* 匹配一段非点字符）
# 示例：只跑 10.10.1.5 和 10.10.1.0/24 网段内、且排除 10.10.1.7：
# filter:
#   includeIPs:
#     IP: ["10.10.1.5", "10.10.1.0/24"]
#     EIP: []
#   excludeIPs:
#     IP: ["10.10.1.7"]
#     EIP: []

http:
  timeout: 30s
  concurrent: 10      # 取密码/详情等 API 并发请求数，默认 10（调大可加快，注意平台压力）

pagination:
  pageSize: 100        # DescribeEcs/DescribeDisks/DescribeEnis 分页大小，部分平台有上限，报错时可调小

ssh:
  username: root       # 登录用户名
  port: 22             # SSH 端口
  timeout: 10s         # 单台登录测试超时
  workers: 5           # 并发测试数量
  verifyCommand: "echo ok"   # 登录成功后执行的验证命令
  useIp: internal      # 用哪个IP测试: internal=内网IP / eip=弹性公网IP / internal-then-eip=先内网后EIP
  # services:          # 未配置 exec-list 时，默认流水线的 services 步骤检查的服务名；留空默认检查 sshd
  #   - sshd
  #   - docker

# ============================================================================
# 流水线 exec-list：登录成功的每台服务器上按顺序执行的模块列表（唯一执行模型）。
# 三种配置形态：
#   1) 不配置（删除本段）      -> 默认流水线: status（采集运行状态）-> services（检查服务状态），
#                                保持工具原有的检查能力（SSH 登录后自动采集状态+查服务）
#   2) execList: []           -> 显式空流水线：不执行任何步骤，只测 SSH 连通性
#   3) 配置步骤列表            -> 完全按下面的步骤执行
#
# 步骤通用字段：
#   name     步骤名（展示/结果表用，缺省自动生成 step1/step2...）
#   type     模块类型: files / command / services / status
#   target   files 模块为传输方向 push（本机->远端）/ pull（远端->本机），【必填】；
#            command 模块为执行位置 local（本机）/ remote（远端），缺省 remote；
#            services/status 固定 remote
#   run      once（本地步骤只跑一次，缺省）/ always（每台服务器都跑）; 仅 command target=local 有意义
#   onError  stop（失败终止后续步骤，缺省）/ continue（失败后继续下一步）
#            注意: 本地 once 步骤失败且 onError=stop 时，全局终止（所有机器不再执行后续步骤）；
#            远端步骤失败且 onError=stop 时，只终止该台机器的后续步骤。
# 每台机器执行时，前一步失败(且 onError=stop)则后续步骤标记"未执行(上游失败)"。
# ============================================================================
execList:
    # ---- 示例1: 本地构建（只跑一次）----
    # - name: "本地构建打包"
    #   type: command
    #   target: local
    #   run: once          # 只跑一次（默认），不重复执行
    #   workdir: "/home/ci/app"        # 可选：先进入该目录（本地执行）
    #   command: "go build -o dist/app ."   # 单行命令；或 script: 内嵌多行 / scriptPath: 本地脚本文件（CRLF 自动转 \n）
    #   timeout: 120s      # 单次执行超时，默认 60s

    # ---- 示例2: files 模块 push（本机 -> 远端，传输文件/文件夹）----
    # - name: "分发安装包"
    #   type: files
    #   target: push                 # 传输方向，必填（push=本机->远端）
    #   overwrite: true              # 步骤级默认覆盖目标端同名文件；缺省 false=已存在则跳过（安全）
    #   mkdirs: true                 # 目标端父目录不存在时自动创建，缺省 true
    #   files:
    #     - local: "dist/app.tar.gz"          # 本机源（文件/文件夹）
    #       remote: "/opt/myapp/app.tar.gz"  # 远端目标（精确文件路径，必须以 / 开头，不能以 / 结尾）
    #       mode: "0644"                      # 目标端权限，八进制，默认 0644
    #       # overwrite: true                 # 单文件覆盖开关，优先于步骤级
    #     - local: "configs/"                 # 本机文件夹：递归传输，保持目录结构
    #       remote: "/opt/myapp/configs"      # 文件夹时远端为目标目录，每个文件映射为 目录/<相对路径>
    #   onError: stop                # 任一文件传输失败则终止本台后续步骤（避免误跑旧文件）

    # ---- 示例3: files 模块 pull（远端 -> 本机，收集/下载）----
    # - name: "收集日志"
    #   type: files
    #   target: pull                 # 传输方向，必填（pull=远端->本机）
    #   files:
    #     - remote: "/var/log/app/"  # 远端源（文件夹：递归拉取保持目录结构）
    #       local: "logs/app/"       # 本机目标目录
    #     - remote: "/etc/app.conf"  # 单个文件
    #       local: "logs/app.conf"
    #   onError: continue

    # ---- 示例4: command 模块（先 cd 到 workdir 再执行，每台机器都跑）----
    # - name: "远端部署"
    #   type: command
    #   target: remote               # 在每台服务器上经 SSH 执行（内容走 stdin 传 bash -s，无转义问题）
    #   workdir: "/opt/myapp"        # 可选：执行前先 cd 到该目录（配合 push 把脚本传到该目录后运行）
    #   command: "bash deploy.sh"    # 直接运行命令；或 script: 内嵌多行 / scriptPath: 本地脚本文件
    #   timeout: 60s
    #   onError: stop

    # ---- 示例5: services 服务状态检查（原 ssh.services 模块收编为流水线步骤）----
    # - name: "检查服务"
    #   type: services              # target 固定 remote
    #   services: ["sshd", "docker"] # 留空默认检查 sshd；结果写入 Excel「服务运行状态」Sheet
    #   onError: continue

    # ---- 示例6: status 服务器运行状态采集（原 checkStatus 模块收编为流水线步骤）----
    # - name: "采集运行状态"
    #   type: status                # target 固定 remote；结果写入 Excel「服务器运行状态」Sheet
    #   onError: continue

# 接口原始返回数据保存目录，留空则不保存
# 目录结构: raw.dir/<运行时间戳>/<Action>[_p<页码>].json
# 注意: 原始数据可能包含 root 密码等敏感信息，注意保管
raw:
  dir: ""

output:
  showPassword: true   # 屏幕是否显示密码，false 则显示 ******
  dir: "results"       # 导出目录（相对/绝对），留空则不导出；文件名自动生成: <配置名>_<时间戳>.xlsx
  # 示例: results/生产环境_20260820_153045.xlsx（同秒撞名自动追加序号）
  # command 步骤输出落盘目录（可选），留空不落盘；每个 command 步骤每个机器一个 .log:
  # 目录结构: scriptDir/<运行时间戳>/<机器名>_<内网IP>_<步骤名>.log，方便逐行排查完整输出
  scriptDir: ""
